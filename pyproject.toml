[project]
name = "TuxKatana"
version = "0.1.0"
description = "Python3/Gtk4 Application controlling Boss Katana Mk2 Amplifier "
readme = "README.md"
license = "AGPL-3.0"
requires-python = ">=3.12,<4.0"
dependencies = [
    "bidict>=0.23.1",
    "mido>=1.3.3",
    "numpy>=2.3.3",
    "pygobject>=3.54.3",
    "python-rtmidi>=1.5.8",
    "ruamel-yaml>=0.18.15",
    "sounddevice>=0.5.2",
]

[project.scripts]
tuxkatana = "TuxKatana:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
